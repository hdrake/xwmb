[project]
name = "xwmb"
dynamic = ["version"]
authors = [
    {name="Henri F. Drake", email="hfdrake@uci.edu"},
]
description = "Efficient and lazy computation of Water Mass Budgets in arbitrary sub-domains of C-grid ocean models"
readme = "README.md"
keywords = [
    "water mass transformation",
    "ocean mixing"
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "regionate >= 0.5.5",
    "xwmt >= 0.3.0",
    # Imported directly (was only pulled in transitively via xwmt). 0.7.0 defaults
    # to name_scheme="v1"; xwmb uses the deprecated aggregate() path via
    # name_scheme="legacy" for now (see the planned v1-native migration).
    "xbudget >= 0.7.0",
]

[project.urls]
"Homepage" = "https://github.com/hdrake/xwmb"
"Bugs/Issues/Features" = "https://github.com/hdrake/xwmb/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "xwmb/version.py"
