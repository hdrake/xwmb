[project]
name = "xwmb"
dynamic = ["version"]
authors = [
    {name="Henri F. Drake", email="hfdrake@uci.edu"},
]
description = "Efficient and lazy computation of Water Mass Budgets in arbitrary sub-domains of C-grid ocean models"
readme = "README.md"
keywords = [
    "water mass transformation",
    "ocean mixing"
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    # The topology-aware stack: every one of these now supports arbitrary
    # `xgcm.Grid` topologies -- single-tile periodic, bipolar/tripolar north-fold
    # (`padding={"Y": {"fold": pivot}}`), and genuinely multi-tile
    # `face_connections` grids such as ECCOv4r4 lat-lon-cap / LLC90.
    #
    # The pre-release pins are deliberate and load-bearing: naming the `rc`
    # explicitly is what allows pip to install it (PEP 440 admits pre-releases
    # only for specifiers that mention one). Bump each to the final release as it
    # lands.
    #
    # xgcm >= 0.10.1 renamed `boundary` -> `padding` (and removed `periodic`),
    # added `cumsum(..., reverse=True)`, the bipolar north-fold boundary, and the
    # multi-tile `face_connections` padding/vector-pad fixes.
    "xgcm >= 0.10.1",
    # xbudget >= 0.8.0: the recipe API. `collect_budgets` no longer mutates the
    # recipe and `xbudget.aggregate()` is gone; recipes are read through
    # `BudgetQuery`, which also resolves term names and carries the UDUNITS units
    # that xwmb's derived-variable metadata is composed from.
    "xbudget >= 0.8.0",
    # sectionate >= 0.4.0rc1: topology-driven section finding (`grid_section`,
    # `GriddedSection`) and `face_connections`-aware `convergent_transport` /
    # `extract_tracer` (thread `f_c` for multi-tile grids). Used directly by xwmb.
    "sectionate >= 0.4.0rc1",
    # regionate >= 0.6.0rc1: `GriddedRegion` / `MaskRegion(s)` whose boundaries
    # are first-class `sectionate.GriddedSection` objects carrying `i_c/j_c/f_c`.
    "regionate >= 0.6.0rc1",
    # xwmt >= 0.3.0rc1: WaterMassTransformations broadcasts across tiles via
    # `_facedim` / `_horizontal_dims`, equations of state are delegated to `xeos`,
    # and `xwmt.units` provides the cf-units algebra xwmb reuses.
    "xwmt >= 0.3.0rc1",
    # xeos >= 0.2.2: the equation of state behind xwmt's `eos=` argument. Declared
    # directly because xwmb's public API exposes the choice. (xwmt itself requires
    # `xeos[teos10] >= 0.2.3`, so the resolver will pick that up regardless.)
    "xeos >= 0.2.2",
]

[project.urls]
"Homepage" = "https://github.com/hdrake/xwmb"
"Bugs/Issues/Features" = "https://github.com/hdrake/xwmb/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from the git tag, not from a file in the tree. Releasing is
# then a single act -- tag `vX.Y.Z` and publish the GitHub Release -- with no
# second commit to remember, and no way for the tag and the built artifact to
# disagree about which version they are.
[tool.hatch.version]
source = "vcs"

# Drop the `+g<sha>` local segment. On a clean tag the version is exactly X.Y.Z
# either way, but an untagged build would otherwise carry a PEP 440 *local*
# version, which package indexes refuse outright. Untagged builds are
# `X.Y.Z.devN` instead, which an index will accept.
[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

# Building writes the resolved version to `xwmb/_version.py`, which is gitignored
# but *is* included in the sdist -- so `pip install` from the sdist, and
# conda-forge's build from the PyPI sdist, both work without git present.
[tool.hatch.build.hooks.vcs]
version-file = "xwmb/_version.py"
