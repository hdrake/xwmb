[project]
name = "xwmb"
dynamic = ["version"]
authors = [
    {name="Henri F. Drake", email="hfdrake@uci.edu"},
]
description = "Efficient and lazy computation of Water Mass Budgets in arbitrary sub-domains of C-grid ocean models"
readme = "README.md"
keywords = [
    "water mass transformation",
    "ocean mixing"
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "regionate >= 0.5.5",
    "xwmt >= 0.3.0",
    # Imported directly (`from xgcm import Grid`). 0.10.0 renamed the `boundary`
    # argument to `padding` on both the Grid constructor and the axis methods,
    # which this code now uses, so the floor is a hard requirement.
    "xgcm >= 0.10.0",
    # Imported directly (`import sectionate`) but previously undeclared, arriving
    # only transitively via regionate.
    #
    # KNOWN ISSUE: sectionate <= 0.3.3 (the latest release) reads the private
    # `xgcm.Axis._boundary`, which xgcm 0.10 removed in favour of `.padding`, so
    # it raises AttributeError. This is NOT confined to explicit sections: the
    # default `region=None` also routes through `regionate.MaskRegions`, so every
    # `WaterMassBudget` construction is affected. The floor below names the first
    # fixed version so the resolver fails loudly at install time rather than
    # installing a known-broken 0.3.3 and failing deep in a call stack.
    "sectionate >= 0.3.4",
    # Imported directly (was only pulled in transitively via xwmt). 0.7.0 defaults
    # to name_scheme="v1"; xwmb uses the deprecated aggregate() path via
    # name_scheme="legacy" for now (see the planned v1-native migration). Cap below
    # 1.0.0, which removes the legacy name_scheme path this depends on.
    "xbudget >= 0.7.0, < 1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/hdrake/xwmb"
"Bugs/Issues/Features" = "https://github.com/hdrake/xwmb/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "xwmb/version.py"
