name: docs_env_xwmb
channels:
  - conda-forge
dependencies:
  - python==3.12
  - black
  - pylint
  - pytest
  - netcdf4
  - nc-time-axis
  - ipython
  - jupyter
  - sphinx
  - nbsphinx
  - jupyter-sphinx
  - matplotlib
  - sphinx-book-theme
  - pip
  # See the note in ci/environment.yml: conda-forge builds of the topology-aware
  # stack's compiled dependencies, so pip does not have to.
  - cf-units
  - geopandas
  - pyproj
  - shapely
  - regionmask
  - gsw
  - numba
  - dask
